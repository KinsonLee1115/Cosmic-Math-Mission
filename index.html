<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freya Math Adventure</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
      }

      /* Custom animations for feedback */
      @keyframes pop-feedback {
        0% {
          opacity: 0;
          transform: scale(0.8) translateY(0);
        }
        20% {
          opacity: 1;
          transform: scale(1.15) translateY(-10px); /* More pronounced pop and slight jump */
        }
        80% {
          opacity: 1;
          transform: scale(1) translateY(0); /* Settle back down */
        }
      }

      .animate-pop-feedback {
        animation: pop-feedback 1.2s ease-out forwards; /* Slightly faster animation */
      }

      /* General subtle bounce for decorative elements */
      @keyframes bounce-subtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .animate-bounce-subtle {
        animation: bounce-subtle 2s ease-in-out infinite;
      }

      /* Floating animation for background elements */
      @keyframes float {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
        25% { transform: translateY(-10px) rotate(5deg); opacity: 0.7; }
        50% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
        75% { transform: translateY(10px) rotate(-5deg); opacity: 0.7; }
        100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      }
      .animate-float {
        animation: float var(--float-duration, 5s) ease-in-out infinite;
      }

      /* Scale-in animation for transitions */
      @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scale-in 0.3s ease-out forwards;
      }

      /* Fade-in animation */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      /* Fade-out animation */
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .animate-fade-out {
        animation: fade-out 0.5s ease-out forwards;
      }

      /* Pop-in animation for dots */
      @keyframes pop-in {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: pop-in 0.2s ease-out forwards;
      }

      /* Hint pop-up animation */
      @keyframes hint-pop {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-hint-pop {
        animation: hint-pop 0.3s ease-out forwards;
      }

      /* Buddy talk animation - now continuous */
      @keyframes friend-talk {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.05); } /* Subtle bounce and scale */
      }
      .animate-friend-talk {
        animation: friend-talk 0.8s ease-in-out infinite; /* Continuous loop */
      }

      /* Buddy reaction animation */
      @keyframes buddy-reaction {
        0% { transform: translateY(20px) scale(0.5); opacity: 0; }
        20% { transform: translateY(0px) scale(1.2); opacity: 1; }
        80% { transform: translateY(-10px) scale(1.0); opacity: 1; }
        100% { transform: translateY(-20px) scale(0.8); opacity: 0; }
      }
      .animate-buddy-reaction {
        animation: buddy-reaction 1.5s ease-out forwards;
      }
      
      /* Jiggle animation for number bond circles */
      @keyframes jiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
      .animate-jiggle {
        animation: jiggle 0.3s ease-in-out;
      }

    </style>
